<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stay or Go – NYC Alternate Side Parking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Greens – suspended / not in effect */
      --green-deep: #064e3b;
      --green-mid: #059669;
      --green-bright: #34d399;
      --green-glow: rgba(52, 211, 153, 0.15);

      /* Reds – in effect */
      --red-deep: #7f1d1d;
      --red-mid: #dc2626;
      --red-bright: #f87171;
      --red-glow: rgba(248, 113, 113, 0.15);

      /* Yellows – stale data */
      --yellow-deep: #713f12;
      --yellow-mid: #ca8a04;
      --yellow-bright: #facc15;

      --bg: #1a1a1e;
      --text: #f0f0f2;
      --text-muted: #9a9aa0;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);

      --font: 'DM Sans', system-ui, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ── Animated gradient border ─────────────────────────────── */

    .border-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .border-glow.visible { opacity: 1; }

    .border-glow::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--glow-gradient);
      mask-image: linear-gradient(#000, #000);
      -webkit-mask-image: linear-gradient(#000, #000);
    }

    /* Green glow */
    .border-glow.green {
      --glow-gradient:
        radial-gradient(ellipse at 0% 0%, var(--green-mid) 0%, transparent 50%),
        radial-gradient(ellipse at 100% 0%, var(--green-deep) 0%, transparent 50%),
        radial-gradient(ellipse at 100% 100%, var(--green-mid) 0%, transparent 50%),
        radial-gradient(ellipse at 0% 100%, var(--green-deep) 0%, transparent 50%);
    }

    .border-glow.green::before { opacity: 0.25; }

    /* Red glow */
    .border-glow.red {
      --glow-gradient:
        radial-gradient(ellipse at 0% 0%, var(--red-mid) 0%, transparent 50%),
        radial-gradient(ellipse at 100% 0%, var(--red-deep) 0%, transparent 50%),
        radial-gradient(ellipse at 100% 100%, var(--red-mid) 0%, transparent 50%),
        radial-gradient(ellipse at 0% 100%, var(--red-deep) 0%, transparent 50%);
    }

    .border-glow.red::before { opacity: 0.25; }

    /* Yellow glow – stale data */
    .border-glow.yellow {
      --glow-gradient:
        radial-gradient(ellipse at 0% 0%, var(--yellow-mid) 0%, transparent 50%),
        radial-gradient(ellipse at 100% 0%, var(--yellow-deep) 0%, transparent 50%),
        radial-gradient(ellipse at 100% 100%, var(--yellow-mid) 0%, transparent 50%),
        radial-gradient(ellipse at 0% 100%, var(--yellow-deep) 0%, transparent 50%);
    }

    .border-glow.yellow::before { opacity: 0.25; }

    /* ── Layout ───────────────────────────────────────────────── */

    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      position: relative;
      z-index: 1;
      gap: 2.5rem;
    }

    /* ── Header ───────────────────────────────────────────────── */

    header {
      text-align: center;
    }

    header h1 {
      font-family: var(--font);
      font-size: clamp(2.2rem, 6vw, 3.5rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    header h1 span {
      transition: color 0.5s ease;
    }

    header h1 em {
      font-style: normal;
      opacity: 0.4;
      font-weight: 400;
    }

    header p {
      margin-top: 0.4rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── Day cards ─────────────────────────────────────────────── */

    .days {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      width: 100%;
      max-width: 520px;
    }

    .day-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 2rem;
      position: relative;
      overflow: hidden;
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.5s ease forwards;
    }

    .day-card:nth-child(2) { animation-delay: 0.12s; }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .day-card .label {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }

    .day-card .date {
      font-family: var(--font);
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
    }

    .day-card .status {
      font-family: var(--font);
      font-size: clamp(2rem, 7vw, 3rem);
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 0.75rem;
    }

    .day-card .status.suspended { color: var(--green-bright); }
    .day-card .status.in-effect { color: var(--red-bright); }
    .day-card .status.not-in-effect { color: var(--green-bright); }

    .day-card .details {
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--text-muted);
    }

    /* Status accent bar on left edge */
    .day-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 1rem;
      bottom: 1rem;
      width: 3px;
      border-radius: 3px;
      background: var(--card-border);
      transition: background 0.4s ease;
    }

    .day-card.suspended::before { background: var(--green-mid); }
    .day-card.in-effect::before { background: var(--red-mid); }
    .day-card.not-in-effect::before { background: var(--green-mid); }

    /* Stale overlay – dims cards and recolors accent */
    .day-card.stale { opacity: 0.7; }
    .day-card.stale::before { background: var(--yellow-mid); }
    .day-card.stale .status { color: var(--yellow-bright); }

    .stale-banner {
      text-align: center;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--yellow-bright);
      letter-spacing: 0.04em;
      padding: 0.5rem 1rem;
      border: 1px solid rgba(250, 204, 21, 0.2);
      border-radius: 8px;
      background: rgba(250, 204, 21, 0.06);
      display: none;
    }

    .stale-banner.visible { display: block; }

    /* ── Footer ───────────────────────────────────────────────── */

    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      opacity: 0.5;
      position: relative;
      z-index: 1;
    }

    footer .refresh-time {
      margin-bottom: 0.25rem;
    }

    /* ── Loading / Error states ────────────────────────────────── */

    .loading {
      text-align: center;
      color: var(--text-muted);
      font-size: 1rem;
    }

    .loading .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid var(--card-border);
      border-top-color: var(--text-muted);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 0.5rem;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error {
      text-align: center;
      color: var(--red-bright);
      font-size: 0.95rem;
    }

    /* ── Responsive ────────────────────────────────────────────── */

    @media (min-width: 640px) {
      .days {
        flex-direction: row;
        max-width: 760px;
      }

      .day-card {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <div class="border-glow" id="borderGlow"></div>

  <div class="container">
    <header>
      <h1><span id="stayText">Stay</span> <em>or</em> <span id="goText">Go</span></h1>
      <p>NYC Alternate Side Parking</p>
    </header>

    <div class="stale-banner" id="staleBanner">⚠ Data may be out of date — last updated <span id="staleTime"></span></div>

    <div class="days" id="days">
      <div class="loading"><span class="spinner"></span> Loading status…</div>
    </div>
  </div>

  <footer>
    <div class="refresh-time" id="refreshTime"></div>
    <div>Data from NYC 311 · Updates every 2 minutes</div>
  </footer>

  <script>
    const API_URL = '/api/parking';
    const REFRESH_INTERVAL = 2 * 60 * 1000;
    const STALE_THRESHOLD = 5 * 60 * 1000; // 5 minutes — data considered stale
    const daysEl = document.getElementById('days');
    const glowEl = document.getElementById('borderGlow');
    const refreshTimeEl = document.getElementById('refreshTime');
    const staleBannerEl = document.getElementById('staleBanner');
    const staleTimeEl = document.getElementById('staleTime');
    const stayTextEl = document.getElementById('stayText');
    const goTextEl = document.getElementById('goText');

    function isStale(lastFetched) {
      if (!lastFetched) return true;
      return Date.now() - new Date(lastFetched).getTime() > STALE_THRESHOLD;
    }

    function updateTitle(todayStatus, stale) {
      if (stale || !todayStatus) {
        stayTextEl.style.color = '';
        goTextEl.style.color = '';
        return;
      }

      const s = todayStatus.toUpperCase();
      if (s === 'SUSPENDED' || s === 'NOT IN EFFECT') {
        stayTextEl.style.color = 'var(--green-bright)';
        goTextEl.style.color = '';
      } else {
        stayTextEl.style.color = '';
        goTextEl.style.color = 'var(--red-bright)';
      }
    }

    function statusClass(status) {
      if (!status) return '';
      const s = status.toUpperCase();
      if (s === 'SUSPENDED') return 'suspended';
      if (s === 'NOT IN EFFECT') return 'not-in-effect';
      return 'in-effect';
    }

    function statusDisplay(status) {
      if (!status) return '—';
      const s = status.toUpperCase();
      if (s === 'SUSPENDED') return 'Suspended';
      if (s === 'NOT IN EFFECT') return 'Not in Effect';
      return 'In Effect';
    }

    function formatDate(dateStr) {
      if (!dateStr || dateStr.length !== 8) return dateStr || '';
      const year = dateStr.slice(0, 4);
      const month = dateStr.slice(4, 6);
      const day = dateStr.slice(6, 8);
      const d = new Date(year, month - 1, day);
      return d.toLocaleDateString('en-US', {
        weekday: 'long',
        month: 'long',
        day: 'numeric',
        year: 'numeric',
      });
    }

    function formatTime(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      return d.toLocaleTimeString('en-US', {
        hour: 'numeric',
        minute: '2-digit',
        timeZoneName: 'short',
      });
    }

    function setGlow(todayStatus, stale) {
      glowEl.className = 'border-glow';
      if (stale) {
        glowEl.classList.add('yellow', 'visible');
      } else {
        const cls = statusClass(todayStatus);
        if (cls === 'in-effect') {
          glowEl.classList.add('red', 'visible');
        } else {
          glowEl.classList.add('green', 'visible');
        }
      }
    }

    function renderCard(label, data, stale) {
      if (!data) return '';
      const cls = statusClass(data.status);
      const staleClass = stale ? ' stale' : '';
      return `
        <div class="day-card ${cls}${staleClass}">
          <div class="label">${label}</div>
          <div class="date">${formatDate(data.date)}</div>
          <div class="status ${cls}">${statusDisplay(data.status)}</div>
          <div class="details">${data.details || ''}</div>
        </div>
      `;
    }

    function updateStaleState(lastFetched) {
      const stale = isStale(lastFetched);
      if (stale) {
        staleBannerEl.classList.add('visible');
        staleTimeEl.textContent = formatTime(lastFetched);
      } else {
        staleBannerEl.classList.remove('visible');
      }
      return stale;
    }

    async function fetchStatus() {
      try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        const stale = updateStaleState(data.lastFetched);
        daysEl.innerHTML = renderCard('Today', data.today, stale) + renderCard('Tomorrow', data.tomorrow, stale);
        setGlow(data.today?.status, stale);
        updateTitle(data.today?.status, stale);
        refreshTimeEl.textContent = `Last updated ${formatTime(data.lastFetched)}`;
      } catch (err) {
        daysEl.innerHTML = `<div class="error">Unable to load parking status. Retrying…</div>`;
        console.error('Fetch error:', err);
      }
    }

    fetchStatus();
    setInterval(fetchStatus, REFRESH_INTERVAL);
  </script>
</body>
</html>
